# film-vault 的 nginx 站点配置
#
# 放到服务器：/etc/nginx/sites-available/film-vault.conf
# 启用：      ln -s /etc/nginx/sites-available/film-vault.conf /etc/nginx/sites-enabled/
#
# 本文件引用的证书必须已存在，否则 nginx 拒绝加载。首次部署请先用
# film-vault.http-only.conf 签证书，再换成本文件（步骤见 docs/04-部署说明.md）。
#
# 只影响 server_name 为 film.ddns.sharepeople.cn 的请求，不动服务器上其他站点。

# ── HTTP：ACME 校验 + 跳转 HTTPS ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name film.ddns.sharepeople.cn;

    # certbot --webroot 校验文件
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：反代到 app 容器 ────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name film.ddns.sharepeople.cn;

    ssl_certificate     /etc/letsencrypt/live/film.ddns.sharepeople.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/film.ddns.sharepeople.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:film_vault_ssl:10m;
    ssl_session_timeout 1d;

    # 单用户私用站点
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 与 app 的 bodyLimit（4MB）保持一致
    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Service Worker 不能被长期缓存，否则 PWA 更新不了
    location = /sw.js {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }
}
