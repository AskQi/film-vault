# 第一步用：只有 80 端口，供 certbot 完成域名校验。
# 签完证书后，用 film-vault.conf 替换本文件。
server {
    listen 80;
    listen [::]:80;
    server_name film.ddns.sharepeople.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "film-vault: waiting for certificate\n";
        add_header Content-Type text/plain;
    }
}
